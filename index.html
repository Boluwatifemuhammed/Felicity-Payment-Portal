<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Payment Portal</title>

    <style>
        /* Reset some default styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
    
        body {
            font-family: 'poppins';
            background-color: #f4f4f4;
            color: #333;
        }
    
        .hero {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-image:
            linear-gradient(to bottom, rgba(10,20,40,0.55), rgba(10,20,40,0.75)),
            url('school background.png'); 
            background-size: cover;       
            background-position: center;  
            background-repeat: no-repeat;
            color: white;
            line-height: 1.2;
            
        }

        .hero-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
        /* max-width: 480px; */
        margin: 0 auto;
        opacity: 0;
        transform: translateY(12px);
        animation: fadeInUp 0.8s ease forwards;
        }

        @keyframes fadeInUp {
        to {
            opacity: 1;
            transform: translateY(0);
        }
        }
    
        .hero-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            padding: 1rem 2rem;
        }
    
        .icon-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }
    
        .brand-name {
            font-size: 1.5rem;
            font-weight: bold;
            
        }
    
        .hero-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        } 

        .hero-content h1 {
            margin: 3rem 0 0 0;
            font-size: 2.5rem;
            font-weight: 650;
        }
    
        .sch-logo{
            max-width: 80px;
        }
        .hero-eyebrow {
            font-size: 1.6rem;
            color: #fdfcfc;
            font-weight: 600;

        }
    
        h1 {
            font-size: 2.5rem;
            margin-top: 0.5rem;
        }
    
        .hero-sub {
            font-size: 1rem;
            margin-top: 1rem;
        }
    
        .btn-primary {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.75rem 1.5rem;
            background-color: #2f6fed;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    
        .btn-primary:hover {
            background-color: #1d4fd1;
        }
    
        .hero-secure {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #9a9999;
        }
    
        .hero-footer {
            color: rgb(97, 96, 96);
            text-align: center;
            padding: 1rem 2rem;
        }
    </style>
</head>
<body>

      <div class="hero">

    <!-- Top bar -->
    <header class="hero-topbar">
      <button class="icon-btn">☰</button>
      <span class="brand-name">Academic Reserve</span>
      <button class="icon-btn">?</button>
    </header>

    <!-- Center content -->
    <div class="hero-content">
      <img src="F.P.S-LOGO.png" alt="school logo" class="sch-logo">
      <p class="hero-eyebrow">FELICITY PRIVATE SCHOOLS</p>
      <h1>Student Payment Portal</h1>
      <p class="hero-sub">Securely manage tuition, fees, and campus services with our institutional payment gateway.</p>

      <a href="payment.html" class="btn-primary">Make Payment →</a>
      <p class="hero-secure">🔒 Secure 256-bit Encrypted Transaction</p>
    </div>

    <!-- Footer -->
    <footer class="hero-footer">
      <p>© 2026 Academic Reserve Financial Systems. All rights reserved.</p>
    </footer>
        
    
  </div>
    
</body>
</html>
