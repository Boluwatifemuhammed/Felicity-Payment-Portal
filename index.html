<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Payment Portal</title>

    <style>
        /* Reset some default styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
    
        body {
              font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
        }
    
        .hero {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
    
        .hero-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #004080;
            color: white;
            padding: 1rem 2rem;
        }
    
        .icon-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }
    
        .brand-name {
            font-size: 1.5rem;
            font-weight: bold;
        }
    
        .hero-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }
    
        .hero-eyebrow {
            font-size: 1.2rem;
            color: #666;
        }
    
        h1 {
            font-size: 2.5rem;
            margin-top: 0.5rem;
        }
    
        .hero-sub {
            font-size: 1.2rem;
            margin-top: 1rem;
        }
    
        .btn-primary {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.75rem 1.5rem;
            background-color: #004080;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    
        .btn-primary:hover {
            background-color: #003366;
        }
    
        .hero-secure {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #666;
        }
    
        .hero-footer {
            background-color: #004080;
            color: white;
            text-align: center;
            padding: 1rem 2rem;
        }
    </style>
</head>
<body>

      <div class="hero">

    <!-- Top bar -->
    <header class="hero-topbar">
      <button class="icon-btn">☰</button>
      <span class="brand-name">Academic Reserve</span>
      <button class="icon-btn">?</button>
    </header>

    <!-- Center content -->
    <div class="hero-content">
      🏦
      <p class="hero-eyebrow">FELICITY PRIVATE SCHOOLS</p>
      <h1>Student Payment Portal</h1>
      <p class="hero-sub">Securely manage tuition, fees, and campus services with our institutional payment gateway.</p>

      <a href="payment.html" class="btn-primary">Make Payment →</a>
      <p class="hero-secure">🔒 Secure 256-bit Encrypted Transaction</p>
    </div>

    <!-- Footer -->
    <footer class="hero-footer">
      <p>© 2026 Academic Reserve Financial Systems. All rights reserved.</p>
    </footer>

  </div>
    
</body>
</html>
