<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academic Reserve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
  }

  body {
    font-family: 'Poppins', sans-serif;
  }

  .landing {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    background-image:
      linear-gradient(to bottom, rgba(255,255,255,0.88), rgba(230,236,245,0.92)),
      url('school-background.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

  /* Top bar */
  .landing-topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
  }

  .landing-topbar h1 {
    font-size: 17px;
    font-weight: 700;
    color: #111827;
  }

  .icon-btn {
    background: none;
    border: none;
    color: #111827;
    cursor: pointer;
    display: flex;
    align-items: center;
    padding: 4px;
  }

  /* Center content */
  .landing-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    max-width: 480px;
    margin: 0 auto;
    opacity: 0;
    transform: translateY(12px);
    animation: fadeInUp 0.8s ease forwards;
  }

  @keyframes fadeInUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .badge-icon {
    width: 56px;
    height: 56px;
    padding: 8px;
    background: #2f6fed;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    margin-bottom: 14px;
    box-shadow: 0 8px 20px rgba(47,111,237,0.35);
  }

  img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    
  }

  .school-eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #2f6fed;
    margin-bottom: 4px;
  }

  .portal-title {
    font-size: 19px;
    font-weight: 700;
    color: #111827;
    margin-bottom: 20px;
  }

  .landing-content h2 {
    font-size: 26px;
    font-weight: 700;
    line-height: 1.25;
    color: #111827;
  }

  .landing-content h2 .highlight {
    color: #2f6fed;
  }

  .landing-sub {
    font-size: 13.5px;
    color: #6b7280;
    line-height: 1.55;
    margin-top: 12px;
    max-width: 320px;
  }

  /* CTA Card */
  .cta-card {
    width: 100%;
    background: #ffffff;
    border-radius: 18px;
    padding: 18px;
    margin-top: 26px;
    box-shadow: 0 10px 30px rgba(16,24,40,0.12);
  }

  .btn-primary {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    background: #2f6fed;
    color: #fff;
    border: none;
    text-decoration: none;
    padding: 14px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .btn-primary:hover {
    background: #1d4fd1;
  }

  .secure-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 11.5px;
    color: #9aa1ac;
    margin-top: 10px;
  }

  /* Secondary shortcut buttons */
  .shortcut-row {
    display: flex;
    gap: 12px;
    width: 100%;
    margin-top: 14px;
  }

  .shortcut-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.7);
    border: 1px solid rgba(17,24,39,0.06);
    border-radius: 14px;
    padding: 14px 10px;
    font-size: 12px;
    font-weight: 600;
    color: #374151;
    cursor: pointer;
    text-decoration: none;
  }

  .shortcut-btn:hover {
    background: #ffffff;
  }

  /* Bottom nav */
  .landing-nav {
    display: flex;
    background: #ffffff;
    border-top: 1px solid #e5e7eb;
    padding: 10px 6px 14px;
  }

  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    background: none;
    border: none;
    color: #9aa1ac;
    font-size: 10.5px;
    font-weight: 600;
    cursor: pointer;
    padding: 6px 4px;
  }

  .nav-item.active {
    color: #2f6fed;
  }

  @media (max-width: 420px) {
    .landing-content { padding: 16px; }
  }
</style>
</head>
<body>

  <div class="landing">

    <!-- Top bar -->
    <header class="landing-topbar">
      <button class="icon-btn"><i data-lucide="menu"></i></button>
      <h1>Academic Reserve</h1>
      <button class="icon-btn"><i data-lucide="help-circle"></i></button>
    </header>

    <!-- Center content -->
    <div class="landing-content">
      <div class="badge-icon">
        <img src="F.P.S LOGO.png" alt="">
      </div>
      <p class="school-eyebrow">FELICITY PRIVATE SCHOOLS</p>
      <p class="portal-title">Student Portal</p>

      <h2>Manage your education <span class="highlight">effortlessly.</span></h2>
      <p class="landing-sub">Securely handle tuition and campus fees with Academic Reserve's trusted gateway.</p>

      <div class="cta-card">
        <a href="payment.html" class="btn-primary">
          Make Payment
          <i data-lucide="arrow-right" width="18" height="18"></i>
        </a>
        <p class="secure-row">
          <i data-lucide="lock" width="13" height="13"></i>
          Secure 256-bit Encrypted Transaction
        </p>

            <div class="shortcut-row">
    <a href="#" class="shortcut-btn">
        <i data-lucide="timer"></i>
        Instant
    </a>
    <a href="#" class="shortcut-btn">
        <i data-lucide="sparkles"></i>
        Effortless
    </a>
    </div>
      </div>
    </div>

    <!-- Bottom nav -->
    <nav class="landing-nav">
      <button class="nav-item active">
        <i data-lucide="home"></i>
        <span>Home</span>
      </button>
      <button class="nav-item">
        <i data-lucide="credit-card"></i>
        <span>Payments</span>
      </button>
      <button class="nav-item">
        <i data-lucide="bell"></i>
        <span>Alerts</span>
      </button>
      <button class="nav-item">
        <i data-lucide="settings"></i>
        <span>Settings</span>
      </button>
    </nav>


  </div>

<script>
  lucide.createIcons();
</script>
</body>
</html>
